<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>das schmeckt! · Proposal Preview</title>
  <style>
    :root { --green:#006642; --cream:#fcfbf7; --yellow:#fff04b; --ink:#183e30; }
    * { box-sizing:border-box; }
    body { margin:0; background:#e8ede7; color:var(--ink); font-family:Arial,sans-serif; }
    header { padding:24px max(24px, calc((100% - 1100px)/2)); background:var(--cream); border-bottom:4px solid var(--green); }
    h1 { margin:0 0 6px; }
    main { max-width:1100px; margin:auto; padding:24px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
    .card { position:relative; background:var(--cream); border:1px solid #cbd6ce; border-radius:10px; padding:18px; }
    .rank { position:absolute; right:14px; top:14px; width:42px; height:42px; display:grid; place-items:center; border-radius:50%; background:var(--yellow); font-weight:bold; }
    .score { display:inline-block; margin:3px 6px 10px 0; padding:6px 8px; background:#edf2e9; border-radius:6px; }
    .status { color:#526057; font-size:13px; }
    .error { color:#9b2c2c; }
  </style>
</head>
<body>
  <header><h1>Das schmeckt! · Rezeptvorschläge</h1><div class="status">Person-A-Mock Preview</div></header>
  <main><div id="cards" class="grid">Lade Vorschläge…</div></main>
  <script>
    fetch('/api/proposals')
      .then(response => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })
      .then(data => {
        const cards = document.getElementById('cards');
        cards.replaceChildren();
        data.proposals.forEach(proposal => {
          const card = document.createElement('article');
          card.className = 'card';
          const wiki = proposal.trend.wikimedia || {};
          card.innerHTML = `
            <div class="rank">${proposal.rank}</div>
            <h2>${escapeHtml(proposal.title)}</h2>
            <div class="score">Trend ${proposal.trend.score}</div>
            <div class="score">Brand ${proposal.brand_fit.score}</div>
            <p>${escapeHtml(proposal.trend.why_relevant)}</p>
            <p><strong>Marken-Fit:</strong> ${escapeHtml(proposal.brand_fit.reasoning)}</p>
            <p><strong>Wikimedia:</strong> ${escapeHtml(wiki.status)}
              ${wiki.score == null ? '' : ' · Score ' + wiki.score}</p>
            <p><strong>Archiv:</strong> ${escapeHtml(proposal.archive.match_status)}
              · ${escapeHtml(proposal.archive.repetition_risk)}</p>
            <p class="status">${escapeHtml(proposal.archive.assumption)}</p>
          `;
          cards.appendChild(card);
        });
      })
      .catch(error => {
        document.getElementById('cards').innerHTML =
          '<p class="error">Backend nicht erreichbar: ' + escapeHtml(error.message) + '</p>';
      });
    function escapeHtml(value) {
      const span = document.createElement('span');
      span.textContent = value == null ? '' : String(value);
      return span.innerHTML;
    }
  </script>
</body>
</html>
